name: Build and Deploy locally

on:
  push:
    branches: ["main"]

  workflow_dispatch:

env:
  TEAM: team2
  IMAGE_NAME: team2/app

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.1.0

      - name: Set image tag
        run: |
          IMAGE_TAG='${{ steps.version.outputs.new_tag }}'
          if [ -z "$IMAGE_TAG" ]; then echo "::error::No version calculated"; exit 1; fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test and analyze with SonarCloud
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: sonar
          no-cache-filters: sonar
          push: false
          secrets: |
            sonar_token=${{ secrets.SONAR_TOKEN }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build Podman
        run: |
          podman build -f Containerfile \
            -t localhost/${IMAGE_NAME}:${IMAGE_TAG} \
            -t localhost/${IMAGE_NAME}:latest .

      - name: Show tags
        run: |
          docker images ${IMAGE_NAME}
          podman images localhost/${IMAGE_NAME}

      - name: Deploy Docker
        run: |
          docker rm -f devops-app 2>/dev/null || true

          docker run -d \
            --name devops-app \
            -p 8080:8080 \
            ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Deploy Podman
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

          mkdir -p ~/.config/containers/systemd/
          # pin the Quadlet to the version just built
          sed "s|^Image=.*|Image=localhost/${IMAGE_NAME}:${IMAGE_TAG}|" app.container \
            > ~/.config/containers/systemd/app.container

          systemctl --user daemon-reload
          systemctl --user restart app.service

      - name: Prune unused Docker images
        run: docker image prune --all --force

      - name: Prune unused Podman images
        run: podman image prune --all --force
