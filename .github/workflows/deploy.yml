name: Build Docs, Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  TEAM: team2
  IMAGE_NAME: team2/app
  REGISTRY: 10.0.40.171:5000

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.version.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare documentation sources
        run: |
          mkdir -p docs src/main/resources/static/docs
          cp -v README.md DOC.md docs/

      - name: Build MkDocs site
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/docs" \
            squidfunk/mkdocs-material \
            build --clean --site-dir src/main/resources/static/docs

      - name: Build documentation PDFs
        run: |
          for f in docs/*.md; do
            [ -f "$f" ] || continue
            filename="$(basename "$f" .md)"
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:/data" \
              pandoc/extra "$f" \
              --pdf-engine=xelatex \
              -o "src/main/resources/static/docs/${filename}.pdf"
          done

      - name: Test and analyze with SonarCloud
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: sonar
          no-cache-filters: sonar
          push: false
          secrets: |
            sonar_token=${{ secrets.SONAR_TOKEN }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Bump version
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.1.0

      - name: Set image tag
        shell: bash
        run: |
          IMAGE_TAG='${{ steps.version.outputs.new_tag }}'
          if [ -z "$IMAGE_TAG" ]; then
            echo '::error::No version calculated'
            exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build Podman image
        run: |
          podman build -f Containerfile \
            -t "localhost/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "localhost/${IMAGE_NAME}:latest" .

      - name: Build integration test image
        run: |
          docker build --target integration-tests \
            -t "${IMAGE_NAME}:integration-tests" .

      - name: Show image tags
        run: |
          docker images "${IMAGE_NAME}"
          podman images "localhost/${IMAGE_NAME}"

      - name: Deploy Docker
        run: |
          docker rm -f devops-app 2>/dev/null || true
          docker run -d --name devops-app -p 8080:8080 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Deploy Podman
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          mkdir -p ~/.config/containers/systemd/
          sed "s|^Image=.*|Image=localhost/${IMAGE_NAME}:${IMAGE_TAG}|" app.container \
            > ~/.config/containers/systemd/app.container
          systemctl --user daemon-reload
          systemctl --user restart app.service

      - name: Wait for Docker application health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-app
          exit 1

      - name: Run integration tests against Docker
        run: |
          docker run --rm --network host \
            -e APP_BASE_URL=http://localhost:8080 \
            "${IMAGE_NAME}:integration-tests"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned production image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}:${IMAGE_TAG}"
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$IMAGE"
          docker push "$IMAGE"

      - name: Prune unused Docker images
        if: always()
        run: docker image prune --all --force

      - name: Prune unused Podman images
        if: always()
        run: podman image prune --all --force
  deploy-production:
    name: Deploy to production server
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, devops2026]
    environment: production
    timeout-minutes: 15

    permissions:
      contents: read

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Verify production server
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME"
          hostname -I

      - name: Login to custom registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}

      - name: Pull Docker image
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
    
          IMAGE="${REGISTRY}/team2/app:${IMAGE_TAG}"
    
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

      - name: Stop previous container
        shell: bash
        run: |
          docker rm -f devops-app 2>/dev/null || true

      - name: Run production container
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
    
          IMAGE="${REGISTRY}/team2/app:${IMAGE_TAG}"
    
          docker run -d \
            --name devops-app \
            --restart unless-stopped \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=production \
            "$IMAGE"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
    
          for attempt in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:8080/actuator/health; then
              echo "Production application is healthy"
              exit 0
            fi
            sleep 2
          done
    
          docker logs --tail 100 devops-app || true
          exit 1
