plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.sonarqube' version '7.5.0.8588'
  id 'jacoco'
}

group = 'com.devops'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sonar {
  properties {
    property "sonar.organization", "hoe-coder"
    property "sonar.projectKey", "hoe-coder_devops26"
  }
}

// Shared configuration for all JUnit test tasks
tasks.withType(Test).configureEach {
  useJUnitPlatform()

  maxHeapSize = '1G'

  reports {
    junitXml.required = true
    html.required = true
  }

  testLogging {
    events 'passed', 'skipped', 'failed'
  }
}

// Unit tests
tasks.named('test', Test) {
  exclude '**/*IntegrationTest.class'
}

// Integration tests against the running Docker application
def integrationTest = tasks.register('integrationTest', Test) {
  description = 'Runs integration tests against the running application'
  group = 'verification'

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  include '**/*IntegrationTest.class'

  systemProperty 'app.baseUrl',
          providers.environmentVariable('APP_BASE_URL')
                  .getOrElse('http://localhost:8080')

  shouldRunAfter(tasks.named('test'))

  // Always execute: the external application can change
  // without any changes to the test source code.
  outputs.upToDateWhen { false }
}

// Report coverage collected by the unit and integration test JVMs
tasks.named('jacocoTestReport') {
  dependsOn(tasks.named('test'), integrationTest)

  executionData(
          tasks.named('test').get(),
          integrationTest.get()
  )

  reports {
    xml.required = true
    html.required = true
    csv.required = false
  }
}

// Standard build/check also runs integration tests and coverage.
// The external application must already be available.
tasks.named('check') {
  dependsOn(integrationTest)
  dependsOn(tasks.named('jacocoTestReport'))
}