plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.sonarqube' version '7.5.0.8588'
  id 'jacoco'
}

group = 'com.devops'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sonar {
  properties {
    property "sonar.organization", "hoe-coder"
    property "sonar.projectKey", "hoe-coder_devops26"
  }
}

// Common configuration for unit and integration tests
tasks.withType(Test).configureEach {
  useJUnitPlatform()

  maxHeapSize = '1G'

  reports {
    junitXml.required = true
    html.required = true
  }

  testLogging {
    events 'passed', 'skipped', 'failed'
  }
}

// Unit tests: everything except *IntegrationTest
tasks.named('test', Test) {
  exclude '**/*IntegrationTest.class'
}

// Integration tests: only *IntegrationTest
def integrationTest = tasks.register('integrationTest', Test) {
  description = 'Runs integration tests'
  group = 'verification'

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  include '**/*IntegrationTest.class'

  shouldRunAfter(tasks.named('test'))
}

// Combined coverage from unit AND integration tests
tasks.named('jacocoTestReport') {
  dependsOn(tasks.named('test'), integrationTest)

  executionData(
          tasks.named('test').get(),
          integrationTest.get()
  )

  reports {
    xml.required = true
    html.required = true
    csv.required = false
  }
}

// Include both test suites and coverage in the standard build
tasks.named('check') {
  dependsOn(integrationTest)
  dependsOn(tasks.named('jacocoTestReport'))
}