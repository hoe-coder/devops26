name: Build and Deploy locally

on:
  push:
    branches: ["main"]

  workflow_dispatch:

env:
  IMAGE_NAME: app

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          # e.g. 42-a1b2c3d  (run number + short commit SHA)
          echo "IMAGE_TAG=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker
        run: |
          docker build -f Dockerfile \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            -t ${IMAGE_NAME}:latest .

      - name: Build Podman
        run: |
          podman build -f Containerfile \
            -t localhost/${IMAGE_NAME}:${IMAGE_TAG} \
            -t localhost/${IMAGE_NAME}:latest .

      - name: Show tags
        run: |
          docker images ${IMAGE_NAME}
          podman images localhost/${IMAGE_NAME}

      - name: Deploy Docker
        run: |
          docker rm -f devops-app 2>/dev/null || true

          docker run -d \
            --name devops-app \
            -p 8080:8080 \
            ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Deploy Podman
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

          mkdir -p ~/.config/containers/systemd/
          # pin the Quadlet to the version just built
          sed "s|^Image=.*|Image=localhost/${IMAGE_NAME}:${IMAGE_TAG}|" app.container \
            > ~/.config/containers/systemd/app.container

          systemctl --user daemon-reload
          systemctl --user restart app.service