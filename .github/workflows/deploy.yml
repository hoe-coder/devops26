name: Build and Deploy locally

on:
  push:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TEAM: team2
  IMAGE_NAME: team2/app

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.1.0

      - name: Set image tag
        run: |
            IMAGE_TAG='${{ steps.version.outputs.new_tag }}'
            if [ -z "$IMAGE_TAG" ]; then echo "::error::No version calculated"; exit 1; fi
            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build Docker and run Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker build -f Dockerfile \
            --secret id=sonar_token,env=SONAR_TOKEN \
            --no-cache-filter builder \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" .

      - name: Build Podman
        run: |
          podman build -f Containerfile \
            -t localhost/${IMAGE_NAME}:${IMAGE_TAG} \
            -t localhost/${IMAGE_NAME}:latest .

      - name: Show tags
        run: |
          docker images ${IMAGE_NAME}
          podman images localhost/${IMAGE_NAME}

      - name: Deploy Docker
        run: |
          docker rm -f devops-app 2>/dev/null || true

          docker run -d \
            --name devops-app \
            -p 8080:8080 \
            ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Deploy Podman
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

          mkdir -p ~/.config/containers/systemd/
          # pin the Quadlet to the version just built
          sed "s|^Image=.*|Image=localhost/${IMAGE_NAME}:${IMAGE_TAG}|" app.container \
            > ~/.config/containers/systemd/app.container

          systemctl --user daemon-reload
          systemctl --user restart app.service

      - name: Wait for running applications
        shell: bash
        run: |
          for port in 8080 8090; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 "http://localhost:$port/" > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "::error::Application on port $port did not become ready"
              exit 1
            fi
          done

      - name: Unit tests, Docker integration tests and coverage
        env:
          APP_BASE_URL: http://localhost:8080
        run: sh ./gradlew check --no-daemon

      - name: Podman integration tests
        env:
          APP_BASE_URL: http://localhost:8090
        run: sh ./gradlew integrationTest --no-daemon

      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configure the SONAR_TOKEN repository secret for SonarQube Cloud"
            exit 1
          fi
          sh ./gradlew sonar --no-daemon -Dsonar.qualitygate.wait=true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: warn
