plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.sonarqube' version '7.5.0.8588'
  id 'jacoco'
}

group = 'com.devops'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sonar {
  properties {
    property 'sonar.host.url', 'https://sonarcloud.io'
    property 'sonar.organization', 'hoe-coder'
    property 'sonar.projectKey', 'hoe-coder_devops26'
    property 'sonar.scm.disabled', 'true'
    property 'sonar.coverage.jacoco.xmlReportPaths',
            'build/reports/jacoco/test/jacocoTestReport.xml'
  }
}

tasks.named('bootJar') {
  archiveFileName = 'app.jar'
}

// Shared configuration for all JUnit test tasks
tasks.withType(Test).configureEach {
  useJUnitPlatform()

  maxHeapSize = '1G'

  reports {
    junitXml.required = true
    html.required = true
  }

  testLogging {
    events 'passed', 'skipped', 'failed'
  }
}

// Unit tests only
// Keep integration tests out of the unit test task
tasks.named('test', Test) {
  exclude '**/*IntegrationTest.class'
}

def integrationTest = tasks.register('integrationTest', Test) {
  description = 'Runs integration tests'
  group = 'verification'

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath

  useJUnitPlatform()
  include '**/*IntegrationTest.class'

  shouldRunAfter(tasks.named('test'))
}

tasks.register('jacocoIntegrationTestReport', JacocoReport) {
  dependsOn(integrationTest)

  executionData(integrationTest.get())
  sourceSets(sourceSets.main)

  reports {
    xml.required = true
    html.required = true
  }
}